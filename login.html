<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - WELINK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    
    <style>
        /* [기본 설정] */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        
        body {
            background-color: #f5f5f5; /* 화면 전체 배경: 연회색 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* ★ [핵심] 전체를 감싸는 큰 흰색 박스 */
        .wrapper {
            background-color: white;
            width: 1440px;  /* 너비 고정 */
            padding: 150px 300px; /* 내부 여백 */
            border-radius: 10px; /* 모서리 둥글게 */
            text-align: center; /* 내부 요소 가운데 정렬 */
            /* 그림자 (선택사항) */
            box-shadow: 0 5px 20px rgba(0,0,0,0.03); 
        }

        /* 1. 로고 (흰색 바탕 위에 위치) */
        .logo-text {
            color: #2252EE;
            font-size: 45px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 40px; /* 로그인 박스와의 간격 */
            display: inline-block;
        }

        /* 2. 로그인 입력 박스 (테두리 있는 박스) */
        .login-card {
            border: 1px solid #e5e5e5; /* 연한 회색 테두리 */
            border-radius: 12px;
            padding: 50px 40px;
            margin-bottom: 30px; /* 하단 링크와의 간격 */
            background-color: white; /* 배경 흰색 */
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: #222;
            margin-bottom: 40px;
        }

        /* 3. 입력 필드 스타일 */
        .input-group { margin-bottom: 25px; text-align: left; }
        
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #000;
            margin-bottom: 10px;
        }

        .input-field {
            width: 100%;
            height: 55px;
            padding: 0 15px;
            font-size: 14px;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fff; /* 입력창 흰색 */
        }
        .input-field::placeholder { color: #ccc; }
        .input-field:focus { outline: none; border-color: #2252EE; }

        /* 4. 로그인 버튼 */
        .login-btn {
            width: 80%;
            height: 60px;
            margin-top: 20px;
            background-color:#2252EE; /* 청회색 */
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover { background-color: #2252EE; }

        /* 5. 하단 링크 */
        .bottom-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            font-size: 13px;
            color: #333;
            font-weight: 700;
        }
        .bottom-links a { text-decoration: none; color: #333; cursor: pointer; }
        .bottom-links a:hover { text-decoration: underline; }
        
        .divider { width: 1px; height: 12px; background-color: #ddd; display: inline-block; }

    </style>
</head>
<body>

    <div class="wrapper">
        
        <div class="logo-text">WELINK</div>

        <div class="login-card">
            <h2 class="login-title">통합회원 로그인</h2>

            <div class="input-group">
                <label for="userid">ID</label>
                <input type="text" id="userid" class="input-field" placeholder="아이디(이메일 주소 형식)를 입력해주세요.">
            </div>

            <div class="input-group">
                <label for="userpw">Password</label>
                <input type="password" id="userpw" class="input-field" placeholder="비밀번호를 입력해주세요.">
            </div>

            <button class="login-btn" onclick="login()">로그인</button>
        </div>

        <div class="bottom-links">
            <a href="#">아이디찾기</a>
            <span class="divider"></span>
            <a href="#">비밀번호찾기</a>
            <span class="divider"></span>
            <a href="index.html">회원가입</a>
        </div>

    </div>

  <!-- <script src="common.js"></script> -->

    <script>
        function login() {
            // 1. 입력값 가져오기 (ID: userid -> Backend: email, PW: userpw -> Backend: password)
            const email = document.getElementById('userid').value;
            const password = document.getElementById('userpw').value;

            if (!email || !password) {
                alert("이메일과 비밀번호를 모두 입력해주세요.");
                return;
            }

            // 2. 백엔드로 로그인 요청 (POST)
            fetch('http://localhost:8080/api/users/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email, // ID input value is sent as 'email'
                    password: password
                }),
            })
            .then(response => {
                if (response.ok) {
                    return response.json(); 
                } else {
                    // 서버가 400 Bad Request 등을 반환했을 때
                    return response.text().then(text => {
                        throw new Error(text || "로그인 실패: 아이디 또는 비밀번호를 확인해주세요.");
                    });
                }
            })
            .then(data => {
                // 3. JWT 토큰 및 사용자 정보 저장 (Local Storage)
                localStorage.setItem('accessToken', data.token); // 토큰 저장
                localStorage.setItem('userName', data.userName); // 사용자 이름 저장
                localStorage.setItem('userId', data.userId);     // 사용자 ID 저장

                // 4. 성공 알림 후 메인 페이지로 이동
                alert("환영합니다, " + data.userName + "님!");
                location.href = 'main.html'; 
            })
            .catch(error => {
                console.error("Fetch Failed:", error);
                // 백엔드에서 보낸 에러 메시지(Exception message)를 사용자에게 알림
                alert(error.message || "로그인에 실패했습니다. 서버 로그를 확인해주세요.");
            });
        }
    </script>
</body>
</html>
