<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeLink - 회원가입 (정보입력)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="step2.css">
</head>
<body>

    <div class="wrapper">
        <header>
            <h1 class="logo">welink</h1>
        </header>

        <div class="page-title">
            <h2>회원가입</h2>
            <p>※ 14세 이상만 가입가능</p>
        </div>

        <div class="stepper">
            <div class="stepper-line"></div>
            <div class="step-list">
                <div class="step-item completed">
                    <div class="step-circle"><i class="fa-solid fa-check"></i></div>
                    <div class="step-text">STEP1<br>약관동의</div>
                </div>
                
                <div class="step-item active">
                    <div class="step-circle"></div> 
                    <div class="step-text">STEP2<br>정보입력</div>
                </div>
            </div>
        </div>

        <div class="form-container">
            <div class="form-header">
                <span class="form-title">가입정보</span>
                <span class="auth-badge"><i class="fa-solid fa-check-circle"></i> 본인인증 완료</span>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <input type="text" id="name" class="input-box" placeholder="이름을 입력하세요.">
                </div>

                <div class="form-group">
                    <div class="flex-row">
                        <input type="text" id="usernameLocal" class="input-box flex-grow" placeholder="아이디 (예: gildong)">
                        <span class="at-mark">@</span>
                        <select id="usernameDomain" class="input-box flex-grow" style="color:#555;">
                            <option value="">선택하세요.</option>
                            <option value="naver.com">naver.com</option>
                            <option value="gmail.com">gmail.com</option>
                        </select>
                        <button type="button" class="btn-small">중복확인</button>
                    </div>
                    <span class="warn">*아이디는 이메일 주소 형식으로 입력하셔야 합니다. (예: gildong@welink.com)</span>
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="input-box" placeholder="비밀번호를 입력하세요.">
                    <span class="warn">*비밀번호는 영문자, 숫자, 특수문자 각각 1개이상 포함하며, 8자이상 20자 이내여야 합니다.</span>
                </div>

                <div class="form-group">
                    <input type="password" id="passwordConfirm" class="input-box" placeholder="위에서 입력한 비밀번호와 동일하게 입력하세요.">
                </div>

                <div class="form-group">
                    <input type="email" id="emailFull" class="input-box" placeholder="비밀번호 찾기용 이메일 주소 전체를 입력하세요.">
                </div>

                <div class="form-group">
                    <div class="flex-row">
                        <input type="text" id="phone" class="input-box flex-grow" placeholder="휴대폰 번호를 입력하세요.">
                        <button type="button" class="btn-small">인증</button>
                    </div>
                </div>

                <div class="form-group">
                    <div class="flex-row">
                        <input type="text" class="input-box flex-grow" placeholder="인증번호 입력">
                        <button type="button" class="btn-small">확인</button>
                    </div>
                </div>

                <div class="btn-wrap">
                    <button type="button" class="btn-big btn-cancel" onclick="location.href='index.html'">취소</button>
                    <button type="button" class="btn-big btn-confirm" onclick="signup()">회원가입</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function signup() {
            // 1. 입력값 가져오기
            const name = document.getElementById('name').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const email = document.getElementById('emailFull').value; // 단일 Email
            const phone = document.getElementById('phone').value;
            
            // ★ 복구된 아이디 분리 입력값 가져와서 합치기
            const usernameLocal = document.getElementById('usernameLocal').value;
            const usernameDomain = document.getElementById('usernameDomain').value;
            const username = usernameLocal + '@' + usernameDomain; // 최종 아이디 (username@domain.com)

            // 2. 유효성 검사
            if (!name || !usernameLocal || !usernameDomain || !password || !phone || !email) {
                alert('모든 필수 정보를 입력해주세요.');
                return;
            }

            if (password !== passwordConfirm) {
                alert('비밀번호가 일치하지 않습니다.');
                return;
            }

            // 3. 데이터 포장 (백엔드 User.java 변수명과 일치시킴)
            const signupData = {
                name: name,
                username: username,  // 합쳐진 아이디 전송
                password: password,
                phone: phone,        
                email: email         // 단일 이메일 전송
            };

            // 4. 백엔드로 전송
            fetch('http://localhost:8080/api/users/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(signupData),
            })
            .then(response => {
                if (response.ok) {
                    return response.text();
                } else {
                    response.text().then(text => console.error("Server Error:", text));
                    throw new Error('회원가입 실패');
                }
            })
            .then(message => {
                alert('가입 성공! 로그인 페이지로 이동합니다.');
                location.href = 'login.html';
            })
            .catch(error => {
                alert('회원가입 실패! (아이디/이메일 중복 등)');
                console.error("Fetch Failed:", error);
            });
        }
    </script>

</body>
</html>
