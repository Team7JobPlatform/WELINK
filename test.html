<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>연동 테스트</title>
    <style>
        body { padding: 50px; font-family: sans-serif; text-align: center; }
        .box { border: 2px solid #ddd; padding: 20px; margin-top: 20px; border-radius: 10px; }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h1>🔌 백엔드 연동 테스트</h1>
    <p>아래 버튼을 눌러서 서버에서 데이터를 가져와 봅시다.</p>
    
    <button onclick="checkConnection()">데이터 가져오기</button>

    <div id="result-box" class="box">
        여기에 결과가 뜹니다...
    </div>

    <script>
        function checkConnection() {
            const resultBox = document.getElementById('result-box');
            resultBox.innerText = "로딩 중...";

            // 백엔드 API 주소 (회사 목록 조회)
            fetch('http://localhost:8080/api/companies')
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error("서버 응답 에러");
                    }
                })
                .then(data => {
                    console.log(data); // F12 콘솔에도 출력
                    resultBox.innerHTML = `<h3 style='color:green'>성공! 🎉</h3><p>데이터 ${data.length}개를 가져왔습니다.</p>`;
                    
                    // 데이터 내용 보여주기
                    data.forEach(item => {
                        resultBox.innerHTML += `<p>${item.name} (${item.location})</p>`;
                    });
                })
                .catch(error => {
                    console.error(error);
                    resultBox.innerHTML = `<h3 style='color:red'>실패 😭</h3><p>백엔드 서버가 켜져 있는지 확인해주세요!</p>`;
                });
        }
    </script>
</body>
</html>
